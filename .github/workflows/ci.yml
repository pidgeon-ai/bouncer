name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIDGEON_TEST_API_KEY: ${{ secrets.PIDGEON_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit and safety tests: an in-memory Pidgeon double and PGlite. No keys, no network.
      - run: pnpm test
      # Against the real Pidgeon API in test mode (nothing leaves Pidgeon), when a test key is configured.
      - if: ${{ env.PIDGEON_TEST_API_KEY != '' }}
        run: pnpm smoke
        env:
          PIDGEON_API_KEY: ${{ env.PIDGEON_TEST_API_KEY }}
          BOUNCER_ADDRESS: ${{ vars.BOUNCER_TEST_ADDRESS }}
